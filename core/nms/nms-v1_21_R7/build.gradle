plugins {
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.21"
}

dependencies {
    compileOnly project(':core:nms:nms-adapter')

    paperweightDevelopmentBundle 'io.papermc.paper:dev-bundle:1.21.11-R0.1-SNAPSHOT'
}

tasks.named('paperweightUserdevSetup') {
    mappedServerJar.set(
            rootProject.layout.projectDirectory.file('build/.gradle/mapped/mappedServerJar-1.21.11.jar'),
    )
    reobfMappings.set(
            rootProject.layout.projectDirectory.file('build/.gradle/mapped/reobfMappings-1.21.11.tiny')
    )
}

tasks.named('jar') {
    layout.buildDirectory.set(rootProject.layout.buildDirectory.dir("module/nms-1_21_R7"))
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
